<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Warm golden gradient for the main/front feather -->
    <linearGradient id="main-grad" x1="16" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4D09C"/>
      <stop offset="50%" stop-color="#D99A6C"/>
      <stop offset="100%" stop-color="#B56A3A"/>
    </linearGradient>
    <!-- Slightly darker/richer gradient for the back/secondary feather -->
    <linearGradient id="back-grad" x1="8" y1="12" x2="28" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E6B98F"/>
      <stop offset="60%" stop-color="#C98B5A"/>
      <stop offset="100%" stop-color="#9A5026"/>
    </linearGradient>
  </defs>

  <!-- SECONDARY FEATHER (Back, pointing up-left) -->
  <g opacity="0.85">
    <!-- Feather body -->
    <path d="M 23 37 C 21 37.5, 18 36, 16 33 C 13.5 29.5, 12.5 24, 12 18 C 15 20, 18.5 24, 20.5 28.5 C 22.5 33, 23 36.5, 23 37 Z" fill="url(#back-grad)" />
    <!-- Spine for back feather -->
    <path d="M 23 37 Q 17.5 27.5 12 18" stroke="#9A5026" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6" />
    <!-- Additional detailed barbs for the back feather -->
    <path d="M 12 18 C 11.5 20, 11 22, 10.5 24.5 C 12.5 25.5, 14.5 27, 16.5 28" stroke="#C98B5A" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M 13.5 22 C 13 24, 12.5 26, 12 28.5 C 14 29.5, 16 30.5, 18.5 31.5" stroke="#C98B5A" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>

  <!-- MAIN FEATHER (Front, pointing up-right) -->
  <g>
    <!-- Feather body -->
    <path d="M 22 39 C 23.5 39, 26.5 37.5, 29.5 33.5 C 33.5 28, 37.5 20, 40.5 11 C 36 14.5, 32.5 20.5, 29.5 26 C 26.5 31.5, 24.5 36.5, 22 39 Z" fill="url(#main-grad)" />
    <!-- Main spine -->
    <path d="M 17 44 C 18 43, 20 41.5, 22 39.5 C 25 36.5, 29.5 30.5, 34 23.5 C 38.5 16.5, 40.5 12, 41 10.5" stroke="#B56A3A" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Barbs / detail lines for main feather -->
    <path d="M 33 21.5 C 34.5 20, 36.5 18, 38.5 16.5" stroke="#F4D09C" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 30 26 C 31.5 24.5, 33.5 22.5, 35.5 21" stroke="#F4D09C" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M 27 30.5 C 28.5 29, 30.5 27, 32.5 25.5" stroke="#F4D09C" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>
</svg>